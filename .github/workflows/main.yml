name: Discord Bot CI

on:
  push:
    branches: [ "main" ] # أو اسم الفرع بتاعك لو مش main
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install discord.py
        
    - name: Run Bot
      env:
        DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }} # هنا بنربط السيكريت بالبوت
      run: python main.py

